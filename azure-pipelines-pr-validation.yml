trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: TerraformInstaller@1
    displayName: 'Install Terraform 1.9.8'
    inputs:
      terraformVersion: '1.9.8'

  - task: Bash@3
    displayName: 'Validate Terraform and policy files'
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        terraform version
        chmod +x scripts/validate-policies.sh
        ./scripts/validate-policies.sh
