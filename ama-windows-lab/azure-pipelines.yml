
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - ama-windows-lab/*

pool:
  vmImage: ubuntu-latest

variables:
  - group: vg-ama-windows-lab
  - name: terraformVersion
    value: '1.9.8'
  - name: workingDirectory
    value: '$(Build.SourcesDirectory)/ama-windows-lab'
  - name: backendResourceGroup
    value: 'rg-terraform-state-dev'
  - name: backendStorageAccount
    value: 'sttfamitkurmapu28'
  - name: backendContainer
    value: 'tfstate'
  - name: backendKey
    value: 'ama-windows-lab.tfstate'

stages:
  # Stage 1: Validate Terraform and create a saved plan
  - stage: Plan
    displayName: 'Terraform Validate and Plan'
    jobs:
      - job: PlanTerraform
        displayName: 'Validate and Plan'
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Terraform Init, Validate and Plan'
            inputs:
              azureSubscription: 'sc-azure-landingzone-dev'
              addSpnToEnvironment: true
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: '$(workingDirectory)'
              inlineScript: |
                set -euo pipefail

                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$TF_VAR_subscription_id"
                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_OIDC_AZURE_SERVICE_CONNECTION_ID="$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"

                # Install Terraform
                mkdir -p "$HOME/.local/bin"
                curl -fsSLo /tmp/terraform.zip \
                  "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
                unzip -o /tmp/terraform.zip -d "$HOME/.local/bin"
                export PATH="$HOME/.local/bin:$PATH"

                terraform version

                # Select the target subscription
                az account set --subscription "$TF_VAR_subscription_id"

                # Initialize the dedicated lab state
                terraform init \
                  -input=false \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=$(backendKey)" \
                  -backend-config="use_azuread_auth=true" \
                  -backend-config="use_oidc=true" \
                  -backend-config="use_cli=false" \
                  -backend-config="oidc_azure_service_connection_id=$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"

                # Check formatting and configuration
                terraform fmt -check -recursive
                terraform validate

                # Create a saved plan
                terraform plan \
                  -input=false \
                  -out=tfplan

            env:
              TF_VAR_subscription_id: $(subscriptionId)
              TF_VAR_admin_password: $(TF_VAR_admin_password)
              ARM_USE_OIDC: 'true'
              ARM_USE_AZUREAD: 'true'
              ARM_SUBSCRIPTION_ID: $(subscriptionId)
              ARM_OIDC_REQUEST_TOKEN: $(System.AccessToken)
              SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
              ARM_OIDC_AZURE_SERVICE_CONNECTION_ID: $(AZURESUBSCRIPTION_SERVICE_CONNECTION_ID)

          - publish: '$(workingDirectory)/tfplan'
            artifact: terraform-plan
            displayName: 'Publish Terraform Plan'

  # Stage 2: Apply the reviewed plan after manual approval
  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - deployment: ApplyTerraform
        displayName: 'Deploy Azure Resources'
        environment: 'ama-windows-lab-approval'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: terraform-plan

                - task: AzureCLI@2
                  displayName: 'Apply Terraform Plan'
                  inputs:
                    azureSubscription: 'sc-azure-landingzone-dev'
                    addSpnToEnvironment: true
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: '$(workingDirectory)'
                    inlineScript: |
                      set -euo pipefail

                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID="$TF_VAR_subscription_id"
                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_OIDC_AZURE_SERVICE_CONNECTION_ID="$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"

                      # Install Terraform
                      mkdir -p "$HOME/.local/bin"
                      curl -fsSLo /tmp/terraform.zip \
                        "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
                      unzip -o /tmp/terraform.zip -d "$HOME/.local/bin"
                      export PATH="$HOME/.local/bin:$PATH"

                      terraform version

                      # Select the target subscription
                      az account set --subscription "$TF_VAR_subscription_id"

                      # Reinitialize the same lab backend
                      terraform init \
                        -input=false \
                        -backend-config="resource_group_name=$(backendResourceGroup)" \
                        -backend-config="storage_account_name=$(backendStorageAccount)" \
                        -backend-config="container_name=$(backendContainer)" \
                        -backend-config="key=$(backendKey)" \
                        -backend-config="use_azuread_auth=true" \
                        -backend-config="use_oidc=true" \
                        -backend-config="use_cli=false" \
                        -backend-config="oidc_azure_service_connection_id=$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"
                      # Apply the exact plan created in Stage 1
                      terraform apply \
                        -input=false \
                        -auto-approve \
                        "$(Pipeline.Workspace)/terraform-plan/tfplan"

                      # Display Terraform outputs
                      terraform output

                  env:
                    TF_VAR_subscription_id: $(subscriptionId)
                    TF_VAR_admin_password: $(TF_VAR_admin_password)
                    ARM_USE_OIDC: 'true'
                    ARM_USE_AZUREAD: 'true'
                    ARM_SUBSCRIPTION_ID: $(subscriptionId)
                    AARM_OIDC_REQUEST_TOKEN: $(System.AccessToken)
                    SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
                    ARM_OIDC_AZURE_SERVICE_CONNECTION_ID: $(AZURESUBSCRIPTION_SERVICE_CONNECTION_ID)