
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - ama-windows-lab/*

pool:
  vmImage: ubuntu-latest

variables:
  - group: vg-ama-windows-lab
  - name: terraformVersion
    value: '1.9.8'
  - name: workingDirectory
    value: '$(Build.SourcesDirectory)/ama-windows-lab'
  - name: backendResourceGroup
    value: 'rg-terraform-state-dev'
  - name: backendStorageAccount
    value: 'sttfamitkurmapu28'
  - name: backendContainer
    value: 'tfstate'
  - name: backendKey
    value: 'ama-windows-lab.tfstate'

stages:
  # Stage 1: Validate Terraform and create a plan
  - stage: Plan
    displayName: 'Terraform Validate and Plan'
    jobs:
      - job: PlanTerraform
        displayName: 'Validate and Plan'
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Terraform Init, Validate and Plan'
            inputs:
              azureSubscription: 'sc-azure-landingzone-dev'
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: '$(workingDirectory)'
              inlineScript: |
                set -euo pipefail

                # Install Terraform
                mkdir -p "$HOME/.local/bin"
                curl -fsSLo /tmp/terraform.zip \
                  "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
                unzip -o /tmp/terraform.zip -d "$HOME/.local/bin"
                export PATH="$HOME/.local/bin:$PATH"

                terraform version

                # Select the target subscription
                az account set --subscription "$TF_VAR_subscription_id"

                # Initialize the separate remote state
                terraform init \
                  -input=false \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=$(backendKey)" \
                  -backend-config="use_azuread_auth=true"

                # Check formatting and configuration
                terraform fmt -check -recursive
                terraform validate

                # Create a saved plan
                terraform plan \
                  -input=false \
                  -out=tfplan
            env:
              TF_VAR_subscription_id: $(subscriptionId)
              TF_VAR_admin_password: $(TF_VAR_admin_password)

          - publish: '$(workingDirectory)/tfplan'
            artifact: terraform-plan
            displayName: 'Publish Terraform Plan'

  # Stage 2: Apply the reviewed plan after environment approval
  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - deployment: ApplyTerraform
        displayName: 'Deploy Azure Resources'
        environment: 'ama-windows-lab-approval'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: terraform-plan

                - task: AzureCLI@2
                  displayName: 'Apply Terraform Plan'
                  inputs:
                    azureSubscription: 'sc-azure-landingzone-dev'
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: '$(workingDirectory)'
                    inlineScript: |
                      set -euo pipefail

                      # Install Terraform
                      mkdir -p "$HOME/.local/bin"
                      curl -fsSLo /tmp/terraform.zip \
                        "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
                      unzip -o /tmp/terraform.zip -d "$HOME/.local/bin"
                      export PATH="$HOME/.local/bin:$PATH"

                      az account set --subscription "$TF_VAR_subscription_id"

                      # Reinitialize the same backend
                      terraform init \
                        -input=false \
                        -backend-config="resource_group_name=$(backendResourceGroup)" \
                        -backend-config="storage_account_name=$(backendStorageAccount)" \
                        -backend-config="container_name=$(backendContainer)" \
                        -backend-config="key=$(backendKey)" \
                        -backend-config="use_azuread_auth=true"

                      # Apply the exact plan produced by Stage 1
                      terraform apply \
                        -input=false \
                        -auto-approve \
                        "$(Pipeline.Workspace)/terraform-plan/tfplan"

                      # Display resource outputs
                      terraform output
                  env:
                    TF_VAR_subscription_id: $(subscriptionId)
                    TF_VAR_admin_password: $(TF_VAR_admin_password)
